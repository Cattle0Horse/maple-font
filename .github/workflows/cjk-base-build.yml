name: Update CJK Base Fonts

on:
  push:
    branches: ["variable"]
    paths:
      - "sources/cjk/*/config-*.json"
      - "sources/cjk/variable-source/MapleMono-CJK-Base-VF.ttf"
      - "scripts/cjk/*.py"
      - "scripts/font_ops/*.py"
      - "scripts/utils/*.py"
      - "scripts/task/cjk.py"
      - "requirements.txt"
      - ".github/workflows/cjk-base-build.yml"
  workflow_dispatch:
    inputs:
      locale:
        description: "Locale to publish if the cache is missing"
        required: true
        default: all
        type: choice
        options: [all, cn, jp, tc, kr]

permissions:
  contents: read

concurrency:
  group: cjk-base-${{ github.repository }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          python-version: "3.12.16"
          enable-cache: true
      - run: uv sync --locked --no-dev
      - id: plan
        name: Select unpublished locale caches
        env:
          MANUAL_LOCALE: ${{ inputs.locale }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | .tag_name')"
          matrix='[]'
          for locale in cn jp tc kr; do
            case "$MANUAL_LOCALE" in
              ""|all|"$locale") ;;
              *) continue ;;
            esac
            key="$(uv run --locked --no-dev task.py cjk cache-key "$locale")"
            if ! grep -Fxq "cjk-base-$locale-$key" <<< "$releases"; then
              matrix="$(jq -c --arg locale "$locale" --arg key "$key" \
                '. + [{locale: $locale, key: $key}]' <<< "$matrix")"
            fi
          done
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      LOCALE: ${{ matrix.locale }}
      CACHE_KEY: ${{ matrix.key }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          python-version: "3.12.16"
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Build and validate CJK base archives
        run: |
          set -euo pipefail
          directory="sources/cjk/$LOCALE/.cache/$CACHE_KEY"
          uv run --locked --no-dev task.py cjk --preset "$LOCALE"
          for kind in static variable; do
            uv run --locked --no-dev task.py cjk cache-validate \
              --archive "$directory/$LOCALE-base-$kind.zip" \
              --hash "$directory/$kind-$LOCALE.sha256" \
              --kind "$kind"
          done
      - name: Publish verified CJK base archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="cjk-base-$LOCALE-$CACHE_KEY"
          directory="sources/cjk/$LOCALE/.cache/$CACHE_KEY"
          assets=(
            "$directory/$LOCALE-base-static.zip"
            "$directory/$LOCALE-base-variable.zip"
            "$directory/static-$LOCALE.sha256"
            "$directory/variable-$LOCALE.sha256"
          )
          if state="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$state" = true ]; then
              gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
            fi
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --latest=false --title "CJK Base Fonts ($LOCALE)" \
              --notes "Prebuilt CJK base archives and content digests." "${assets[@]}"
          fi
